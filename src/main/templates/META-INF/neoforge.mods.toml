modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile="logo.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "mekanism"
type = "required"
versionRange = "${mekanism_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "evolvedmekanism"
type = "required"
versionRange = "[1.2.1,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "mekanism_extras"
type = "required"
versionRange = "[1.3.3,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "mekmm"
type = "optional"
versionRange = "[1.3.1,)"
ordering = "AFTER"
side = "BOTH"