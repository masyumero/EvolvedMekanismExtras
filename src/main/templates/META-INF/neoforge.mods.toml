modLoader = "javafml" #mandatory
loaderVersion = "[1,)" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license = "${mod_license}"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
logoFile="logo.png" #optional
authors = "${mod_authors}" #optional
description = '''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]] #optional
modId = "neoforge" #mandatory
mandatory = true #mandatory
versionRange = "${neo_version},)" #mandatory
ordering = "AFTER"
side = "BOTH"# Here's another dependency

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "mekanism"
mandatory = true
versionRange = "${mekanism_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "evolvedmekanism"
mandatory = true
versionRange = "[1.2.1,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "mekanism_extras"
mandatory = true
versionRange = "[1.3.3,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "mekmm"
mandatory = true
versionRange = "[1.3.1,)"
ordering = "AFTER"
side = "BOTH"