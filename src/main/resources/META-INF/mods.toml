modLoader="javafml"
loaderVersion = "[47,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "mekanism"
mandatory = true
versionRange = "${mekanism_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "evolvedmekanism"
mandatory = true
versionRange = "[1.2-fix1,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "mekanism_extras"
mandatory = true
versionRange = "[1.20.1-1.4.6,)"
ordering = "AFTER"
side = "BOTH"